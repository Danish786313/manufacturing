<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAF5E8"/>
      <stop offset="100%" stop-color="#D7ECD4"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#237B38"/>
      <stop offset="100%" stop-color="#155526"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#155526" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="500" height="360" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle leaf patterns in background -->
  <path d="M420 30 C460 20, 480 60, 470 100 C430 90, 410 50, 420 30 Z" fill="#237B38" opacity="0.12"/>
  <path d="M40 280 C80 270, 100 310, 90 350 C50 340, 30 300, 40 280 Z" fill="#237B38" opacity="0.12"/>

  <!-- Shadow below box -->
  <ellipse cx="250" cy="305" rx="160" ry="22" fill="#000000" opacity="0.15"/>

  <!-- Tissue emerging from top -->
  <path d="M210 160 C200 110, 220 80, 245 70 C270 60, 285 90, 290 120 C295 140, 290 160, 290 160 Z" fill="#F8FBF9"/>
  <path d="M225 150 C235 95, 260 75, 275 80 C290 85, 280 125, 275 150 Z" fill="#FFFFFF"/>
  <path d="M245 70 C255 100, 250 140, 248 160" stroke="#E2EBE2" stroke-width="2" fill="none"/>

  <!-- Tissue Box Base -->
  <g filter="url(#shadow)">
    <!-- Main Box Front -->
    <rect x="120" y="160" width="260" height="125" rx="12" fill="url(#boxGrad)"/>
    <!-- Top rim/lid -->
    <path d="M120 172 C120 165, 126 160, 133 160 L367 160 C374 160, 380 165, 380 172 L380 180 L120 180 Z" fill="#2E9E49"/>
    
    <!-- Tissue Dispenser Opening -->
    <ellipse cx="250" cy="172" rx="45" ry="8" fill="#155526"/>
    
    <!-- Brand Label on Box -->
    <rect x="150" y="195" width="200" height="65" rx="8" fill="#FFFFFF"/>
    <text x="250" y="222" font-family="'Georgia', serif" font-size="20" font-weight="700" fill="#155526" text-anchor="middle">Shobha</text>
    <text x="250" y="238" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#237B38" text-anchor="middle" letter-spacing="1.5">SOFT TISSUE</text>
    
    <!-- Count badge -->
    <rect x="175" y="244" width="150" height="14" rx="7" fill="#EAF5E8"/>
    <text x="250" y="254" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#155526" text-anchor="middle">40 | 50 | 100 PULLS</text>
  </g>
</svg>
