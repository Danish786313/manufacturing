<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="100%">
  <defs>
    <linearGradient id="hardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAF5E8"/>
      <stop offset="100%" stop-color="#DEF0DC"/>
    </linearGradient>
    <linearGradient id="napkinEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F2F6F2"/>
      <stop offset="100%" stop-color="#E2EBE2"/>
    </linearGradient>
    <filter id="hardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#155526" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="500" height="360" rx="16" fill="url(#hardBg)"/>
  
  <ellipse cx="250" cy="305" rx="170" ry="20" fill="#000000" opacity="0.14"/>

  <!-- Stack of Hard Tissues (Napkin / Folded style) -->
  <g filter="url(#hardShadow)" transform="translate(130, 80)">
    <!-- Isometric-style neat stack layers -->
    <!-- Base block of paper -->
    <path d="M40 160 L130 215 L200 170 L110 115 Z" fill="#E6EDE6"/>
    
    <!-- Stack thickness layers -->
    <path d="M40 160 L130 215 L130 225 L40 170 Z" fill="#D2DDD2"/>
    <path d="M130 215 L200 170 L200 180 L130 225 Z" fill="#C4D1C4"/>

    <!-- Stack 2 -->
    <path d="M40 140 L130 195 L200 150 L110 95 Z" fill="#F1F7F1"/>
    <path d="M40 140 L130 195 L130 205 L40 150 Z" fill="#DDE7DD"/>
    <path d="M130 195 L200 150 L200 160 L130 205 Z" fill="#CEDCCE"/>

    <!-- Stack Top Block (crisp textured folded tissue) -->
    <path d="M40 110 L130 165 L200 120 L110 65 Z" fill="#FFFFFF" stroke="#E5EEE5" stroke-width="1"/>
    <path d="M40 110 L130 165 L130 140 L40 85 Z" fill="#EBF3EB"/>
    <path d="M130 165 L200 120 L200 95 L130 140 Z" fill="#DFECDF"/>

    <!-- Subtle embossed dot grid pattern representing durable hard tissue texture -->
    <g opacity="0.4">
      <circle cx="85" cy="115" r="1.5" fill="#155526"/>
      <circle cx="95" cy="110" r="1.5" fill="#155526"/>
      <circle cx="105" cy="105" r="1.5" fill="#155526"/>
      <circle cx="95" cy="125" r="1.5" fill="#155526"/>
      <circle cx="105" cy="120" r="1.5" fill="#155526"/>
      <circle cx="115" cy="115" r="1.5" fill="#155526"/>
      <circle cx="125" cy="110" r="1.5" fill="#155526"/>
      <circle cx="115" cy="130" r="1.5" fill="#155526"/>
      <circle cx="125" cy="125" r="1.5" fill="#155526"/>
      <circle cx="135" cy="120" r="1.5" fill="#155526"/>
      <circle cx="145" cy="115" r="1.5" fill="#155526"/>
    </g>

    <!-- Packaging Sleeve Band around stack -->
    <path d="M75 131 L145 174 L175 154 L105 111 Z" fill="#237B38"/>
    <path d="M75 131 L145 174 L145 186 L75 143 Z" fill="#155526"/>
    <path d="M145 174 L175 154 L175 166 L145 186 Z" fill="#10431D"/>
    
    <!-- Text on sleeve -->
    <text x="125" y="145" transform="rotate(32, 125, 145)" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">SHOBHA HARD TISSUE</text>
    <text x="125" y="157" transform="rotate(32, 125, 157)" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="600" fill="#EAF5E8" text-anchor="middle">40 | 50 | 100 PACKS</text>
  </g>

  <!-- Feature Badge -->
  <rect x="30" y="25" width="130" height="28" rx="14" fill="#FFFFFF" stroke="#237B38" stroke-width="1.2"/>
  <text x="95" y="43" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#155526" text-anchor="middle">High Absorbency</text>
</svg>
