<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="logoGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#237B38"/>
      <stop offset="100%" stop-color="#155526"/>
    </linearGradient>
    <linearGradient id="leafLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80DE8B"/>
      <stop offset="100%" stop-color="#3FA652"/>
    </linearGradient>
  </defs>

  <!-- Left Emblem Group -->
  <g transform="translate(10, 8)">
    <!-- Outer Decorative Ring -->
    <ellipse cx="32" cy="32" rx="30" ry="29" fill="none" stroke="#237B38" stroke-width="2.5"/>
    <ellipse cx="32" cy="32" rx="26" ry="25" fill="#F7FBF6"/>
    
    <!-- SM Letters -->
    <text x="32" y="38" font-family="'Times New Roman', Times, serif" font-size="28" font-weight="900" font-style="italic" fill="#155526" text-anchor="middle">SM</text>
    
    <!-- Leaves sprouting from M -->
    <path d="M43 21 C49 14, 56 16, 56 22 C50 25, 45 24, 43 21 Z" fill="url(#leafLight)"/>
    <path d="M45 22 C48 18, 54 19, 55 22" stroke="#155526" stroke-width="0.8" fill="none"/>
    <path d="M40 26 C45 22, 50 24, 51 29 C46 30, 42 29, 40 26 Z" fill="#237B38"/>

    <!-- Small label beneath SM -->
    <rect x="12" y="44" width="40" height="10" rx="3" fill="#155526"/>
    <text x="32" y="51.5" font-family="'Segoe UI', Roboto, sans-serif" font-size="5.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">TISSUE PAPER</text>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(86, 12)">
    <!-- Shobha Name -->
    <text x="0" y="34" font-family="'Georgia', serif" font-size="34" font-weight="700" fill="#155526" letter-spacing="-0.5">Shobha</text>
    
    <!-- Decorative Leaf on brand name -->
    <path d="M110 8 C116 3, 122 5, 122 10 C117 12, 112 11, 110 8 Z" fill="url(#leafLight)"/>
    <path d="M107 12 C111 9, 116 10, 117 14 C113 15, 109 14, 107 12 Z" fill="#237B38"/>

    <!-- Divider Bar -->
    <line x1="0" y1="41" x2="220" y2="41" stroke="#237B38" stroke-width="1.5" stroke-opacity="0.35"/>

    <!-- Subtitle: TISSUE MANUFACTURING -->
    <text x="0" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#237B38" letter-spacing="2.2">TISSUE MANUFACTURING</text>
    
    <!-- Tagline: Softness for a Cleaner Tomorrow -->
    <text x="0" y="64" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-style="italic" fill="#5A6D5D" letter-spacing="0.4">Softness for a Cleaner Tomorrow</text>
  </g>
</svg>
